<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="EULER-Ω 終極擴增實境工作室">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EULER-Ω">
<title>EULER-Ω｜終極擴增實境工作室</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./圖示/圖示-192.svg">
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
<script src="https://unpkg.com/delaunator@5.0.0/delaunator.min.js"></script>
<style>
:root{--雷射:#00f3ff;--面板:rgba(8,12,16,.82);--次要:rgba(255,255,255,.6);--安全上:env(safe-area-inset-top,0px);--安全下:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}button,input,select{font:inherit}#舞台{position:fixed;inset:0;background:#000}video{display:none}canvas{position:absolute;inset:0;width:100%;height:100%}#頂列{position:absolute;z-index:10;left:0;right:0;top:0;padding:calc(var(--安全上) + 12px) 14px 24px;display:flex;align-items:center;background:linear-gradient(#000,transparent)}#品牌{color:var(--雷射);font-weight:900;letter-spacing:3px}#狀態{margin-left:auto;font-size:11px;color:var(--次要)}#狀態點{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ffb020;margin-right:5px;box-shadow:0 0 10px currentColor}#控制區{position:absolute;z-index:20;left:10px;right:10px;bottom:calc(var(--安全下) + 10px);background:var(--面板);border:1px solid rgba(255,255,255,.12);border-radius:18px;backdrop-filter:blur(22px);overflow:hidden}#控制標題{height:52px;padding:0 14px;display:flex;align-items:center;color:var(--雷射);font-weight:800;letter-spacing:2px}#控制標題 span{margin-left:auto;color:var(--次要);font-size:12px}#控制區.收合{transform:translateY(calc(100% - 52px))}.分頁列{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px;border-top:1px solid rgba(255,255,255,.1);border-bottom:1px solid rgba(255,255,255,.1)}.分頁{min-height:42px;border:0;border-radius:10px;background:transparent;color:var(--次要)}.分頁.啟用{background:rgba(0,243,255,.14);color:var(--雷射)}.內容{display:none;padding:12px;max-height:42vh;overflow:auto}.內容.啟用{display:block}.列{display:flex;flex-wrap:wrap;gap:8px}.按鈕{min-height:44px;padding:0 13px;border-radius:11px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#fff}.按鈕.啟用{background:var(--雷射);color:#000;border-color:var(--雷射)}.網格{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.滑桿{display:flex;flex-direction:column;gap:6px;font-size:11px;color:var(--雷射)}input[type=range]{width:100%;accent-color:var(--雷射)}#提示{position:absolute;z-index:5;inset:0;display:grid;place-items:center;text-align:center;color:var(--雷射);opacity:.35;pointer-events:none}#訊息{position:absolute;z-index:30;left:50%;bottom:calc(var(--安全下) + 270px);transform:translate(-50%,20px);opacity:0;transition:.25s;background:#000;border:1px solid var(--雷射);border-radius:999px;padding:9px 16px;color:var(--雷射);white-space:nowrap}#訊息.顯示{opacity:1;transform:translate(-50%,0)}#載入{position:fixed;z-index:99;inset:0;display:grid;place-items:center;background:radial-gradient(circle,#00151a,#000 70%);color:var(--雷射);letter-spacing:3px;text-align:center}.圈{width:60px;height:60px;margin:auto;border:3px solid rgba(0,243,255,.2);border-top-color:var(--雷射);border-radius:50%;animation:轉 1s linear infinite}@keyframes 轉{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="載入"><div><div class="圈"></div><h2>EULER-Ω</h2><small>初始化鏡頭與 AI</small></div></div>
<div id="舞台">
<video id="鏡頭" autoplay playsinline muted></video><video id="背景影片" autoplay playsinline loop muted></video><img id="背景圖片" hidden alt=""><canvas id="畫布"></canvas>
<div id="頂列"><div id="品牌">EULER-Ω</div><div id="狀態"><i id="狀態點"></i>AI / CAM</div></div>
<div id="提示">匯入圖片或影片背景</div>
<div id="控制區"><div id="控制標題">控制面板<span>點擊收合</span></div><div class="分頁列"><button class="分頁 啟用" data-tab="鏡頭">鏡頭</button><button class="分頁" data-tab="網格">網格</button><button class="分頁" data-tab="調色">調色</button><button class="分頁" data-tab="輸出">輸出</button></div>
<section class="內容 啟用" data-body="鏡頭"><div class="列"><button id="翻轉" class="按鈕">翻轉鏡頭</button><button id="鏡像" class="按鈕 啟用">鏡像</button><button id="匯入" class="按鈕">匯入背景</button><button id="清除" class="按鈕">清除背景</button></div></section>
<section class="內容" data-body="網格"><div class="列"><button id="臉網" class="按鈕">臉部網格</button><button id="手網" class="按鈕">手部網格</button><button id="骨架" class="按鈕">姿態骨架</button><button id="三角" class="按鈕">三角網格</button></div><div class="網格"><label class="滑桿">網格密度<input id="密度" type="range" min="20" max="100" value="70"></label><label class="滑桿">網格亮度<input id="網格亮度" type="range" min="20" max="100" value="75"></label></div></section>
<section class="內容" data-body="調色"><div class="網格"><label class="滑桿">背景暗度<input id="暗度" type="range" min="0" max="100" value="20"></label><label class="滑桿">色調<input id="色調" type="range" min="0" max="360" value="190"></label><label class="滑桿">亮度<input id="亮度" type="range" min="30" max="200" value="100"></label><label class="滑桿">對比度<input id="對比" type="range" min="30" max="200" value="100"></label></div></section>
<section class="內容" data-body="輸出"><div class="列"><button id="截圖" class="按鈕">截圖</button><button id="錄影" class="按鈕">錄影</button><button id="儲存" class="按鈕">儲存設定</button><button id="載入設定" class="按鈕">載入設定</button></div></section></div>
<div id="訊息"></div><input id="檔案" type="file" accept="image/*,video/*" hidden>
</div>
<script>
(()=>{'use strict';const 取=id=>document.getElementById(id),全=s=>document.querySelectorAll(s);const 鏡頭=取('鏡頭'),背景影片=取('背景影片'),背景圖片=取('背景圖片'),畫布=取('畫布'),繪圖=畫布.getContext('2d'),訊息=取('訊息');const 設定={方向:'user',鏡像:true,背景:'鏡頭',暗度:20,色調:190,亮度:100,對比:100,密度:70,網格亮度:75,臉網:false,手網:false,骨架:false,三角:false};let 串流,人工智慧,錄影器,片段=[],錄影中=false,最後送出=0;
function 提示(t){訊息.textContent=t;訊息.classList.add('顯示');clearTimeout(提示.t);提示.t=setTimeout(()=>訊息.classList.remove('顯示'),1800)}
function 調整(){const d=Math.min(2,devicePixelRatio||1);畫布.width=innerWidth*d;畫布.height=innerHeight*d;繪圖.setTransform(d,0,0,d,0,0)}
function 填滿(來源){const sw=來源.videoWidth||來源.naturalWidth,sh=來源.videoHeight||來源.naturalHeight;if(!sw||!sh)return;const r=Math.max(innerWidth/sw,innerHeight/sh);繪圖.drawImage(來源,(innerWidth-sw*r)/2,(innerHeight-sh*r)/2,sw*r,sh*r)}
async function 啟動鏡頭(){try{串流?.getTracks().forEach(t=>t.stop());串流=await navigator.mediaDevices.getUserMedia({video:{facingMode:設定.方向,width:{ideal:1280},height:{ideal:720}},audio:false});鏡頭.srcObject=串流;await 鏡頭.play();取('狀態點').style.background='#22e28a'}catch(e){取('狀態點').style.background='#ff3b57';提示('請允許鏡頭權限')}}
function 畫骨架(r){const w=innerWidth,h=innerHeight,c=`hsla(${設定.色調},100%,${設定.網格亮度}%,.82)`;繪圖.strokeStyle=c;繪圖.lineCap='round';if(設定.臉網&&r.faceLandmarks&&window.FACEMESH_TESSELATION){繪圖.beginPath();for(const x of FACEMESH_TESSELATION){const a=r.faceLandmarks[x[0]],b=r.faceLandmarks[x[1]];繪圖.moveTo(a.x*w,a.y*h);繪圖.lineTo(b.x*w,b.y*h)}繪圖.lineWidth=.65;繪圖.stroke()}if(設定.骨架&&r.poseLandmarks&&window.POSE_CONNECTIONS){繪圖.beginPath();for(const x of POSE_CONNECTIONS){const a=r.poseLandmarks[x[0]],b=r.poseLandmarks[x[1]];if((a.visibility||0)<.35||(b.visibility||0)<.35)continue;繪圖.moveTo(a.x*w,a.y*h);繪圖.lineTo(b.x*w,b.y*h)}繪圖.lineWidth=2.2;繪圖.stroke()}if(設定.手網&&window.HAND_CONNECTIONS){for(const hand of [r.leftHandLandmarks,r.rightHandLandmarks]){if(!hand)continue;繪圖.beginPath();for(const x of HAND_CONNECTIONS){const a=hand[x[0]],b=hand[x[1]];繪圖.moveTo(a.x*w,a.y*h);繪圖.lineTo(b.x*w,b.y*h)}繪圖.lineWidth=2;繪圖.stroke()}}if(設定.三角&&window.Delaunator){const p=[];if(r.faceLandmarks)for(let i=0;i<r.faceLandmarks.length;i+=Math.max(4,Math.round(12-設定.密度/10))){const q=r.faceLandmarks[i];p.push([q.x*w,q.y*h])}if(p.length>2){const t=Delaunator.from(p).triangles;for(let i=0;i<t.length;i+=3){const a=p[t[i]],b=p[t[i+1]],d=p[t[i+2]];繪圖.beginPath();繪圖.moveTo(...a);繪圖.lineTo(...b);繪圖.lineTo(...d);繪圖.closePath();繪圖.lineWidth=.7;繪圖.stroke()}}}}
function 呈現(r){繪圖.clearRect(0,0,innerWidth,innerHeight);繪圖.save();if(設定.鏡像){繪圖.translate(innerWidth,0);繪圖.scale(-1,1)}if(設定.背景==='鏡頭')填滿(鏡頭);else if(設定.背景==='影片')填滿(背景影片);else 填滿(背景圖片);繪圖.restore();if(設定.暗度){繪圖.fillStyle=`rgba(0,0,0,${設定.暗度/100})`;繪圖.fillRect(0,0,innerWidth,innerHeight)}繪圖.save();if(設定.鏡像){繪圖.translate(innerWidth,0);繪圖.scale(-1,1)}畫骨架(r);繪圖.restore()}
function 套用(){畫布.style.filter=`brightness(${設定.亮度}%) contrast(${設定.對比}%)`;document.documentElement.style.setProperty('--雷射',`hsl(${設定.色調},100%,50%)`)}
function 切換(id,key){取(id).onclick=()=>{設定[key]=!設定[key];取(id).classList.toggle('啟用',設定[key])}}
全('.分頁').forEach(b=>b.onclick=()=>{全('.分頁,.內容').forEach(x=>x.classList.remove('啟用'));b.classList.add('啟用');document.querySelector(`[data-body="${b.dataset.tab}"]`).classList.add('啟用')});取('控制標題').onclick=()=>取('控制區').classList.toggle('收合');取('翻轉').onclick=async()=>{設定.方向=設定.方向==='user'?'environment':'user';設定.鏡像=設定.方向==='user';取('鏡像').classList.toggle('啟用',設定.鏡像);await 啟動鏡頭()};取('鏡像').onclick=()=>{設定.鏡像=!設定.鏡像;取('鏡像').classList.toggle('啟用',設定.鏡像)};切換('臉網','臉網');切換('手網','手網');切換('骨架','骨架');切換('三角','三角');[['暗度','暗度'],['色調','色調'],['亮度','亮度'],['對比','對比'],['密度','密度'],['網格亮度','網格亮度']].forEach(([id,k])=>取(id).oninput=e=>{設定[k]=+e.target.value;套用()});取('匯入').onclick=()=>取('檔案').click();取('檔案').onchange=e=>{const f=e.target.files[0];if(!f)return;const u=URL.createObjectURL(f);if(f.type.startsWith('video')){設定.背景='影片';背景影片.src=u;背景影片.play()}else{設定.背景='圖片';背景圖片.hidden=false;背景圖片.src=u}取('提示').style.display='none'};取('清除').onclick=()=>{設定.背景='鏡頭';取('提示').style.display='grid'};取('截圖').onclick=()=>畫布.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`EULER-${Date.now()}.png`;a.click()});取('錄影').onclick=()=>{if(錄影中){錄影器.stop();錄影中=false;取('錄影').textContent='錄影';return}const s=畫布.captureStream(30);錄影器=new MediaRecorder(s);片段=[];錄影器.ondataavailable=e=>e.data.size&&片段.push(e.data);錄影器.onstop=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(片段,{type:'video/webm'}));a.download=`EULER-${Date.now()}.webm`;a.click()};錄影器.start();錄影中=true;取('錄影').textContent='停止錄影'};取('儲存').onclick=()=>{localStorage.setItem('EULER設定',JSON.stringify(設定));提示('設定已儲存')};取('載入設定').onclick=()=>{Object.assign(設定,JSON.parse(localStorage.getItem('EULER設定')||'{}'));套用();提示('設定已載入')};window.addEventListener('resize',調整);
async function 開始(){調整();套用();人工智慧=new Holistic({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/holistic/${f}`});人工智慧.setOptions({modelComplexity:1,smoothLandmarks:true,refineFaceLandmarks:true,minDetectionConfidence:.5,minTrackingConfidence:.5});人工智慧.onResults(呈現);await 啟動鏡頭();取('載入').style.display='none';循環();if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js')}
async function 循環(){const n=performance.now();if(鏡頭.videoWidth&&n-最後送出>33){最後送出=n;try{await 人工智慧.send({image:鏡頭})}catch{}}requestAnimationFrame(循環)}window.addEventListener('load',開始)})();
</script>
</body>
</html>
